<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Weiterleitung …</title>
    <script>
      const q = new URLSearchParams(location.search);
      const orig = q.get("o");
      const mirror = q.get("m");
      const dest = /^https:\/\/archive\./i.test(mirror ?? "")
        ? mirror
        : orig
          ? `https://archive.is/newest/${orig}`
          : "./";
      location.replace(dest);
    </script>
  </head>
  <body></body>
</html>
