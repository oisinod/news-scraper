name: Update articles

on:
  schedule:
    # Twice an hour: GitHub often delays or skips scheduled runs, so one slot isn't reliable.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds
        env:
          ARCHIVE_VERIFY: "1"
        run: node scripts/fetch-feeds.mjs
        timeout-minutes: 45
      - name: Commit changes
        run: |
          if git diff --quiet -- articles.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "chore: update articles"
          git push
