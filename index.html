<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>ZEIT &amp; KSTA – Schlagzeilen</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Schlagzeilen" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --card: #fff;
        --text: #111;
        --muted: #5c6370;
        --border: #e2e5ea;
        --chip: #fff;
        --chip-active: #111;
        --chip-active-text: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171717;
          --text: #f5f5f5;
          --muted: #a1a1aa;
          --border: #2e2e2e;
          --chip: #262626;
          --chip-active: #fafafa;
          --chip-active-text: #111;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 1.0625rem/1.45 system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-y: contain;
      }
      #ptr {
        position: fixed;
        left: 0;
        right: 0;
        top: max(0.35rem, env(safe-area-inset-top));
        z-index: 20;
        display: flex;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-120%);
        transition: opacity 0.15s ease;
      }
      #ptr.visible { opacity: 1; }
      #ptr-inner {
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--muted);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .wrap { max-width: 42rem; margin: 0 auto; }
      header.top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.65rem;
      }
      header .head-main { flex: 1; min-width: 0; }
      header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
      #updated { display: block; margin-top: 0.25rem; color: var(--muted); font-size: 0.8125rem; }
      #refresh-btn {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        min-width: 2.75rem;
        min-height: 2.75rem;
        padding: 0.45rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        color: inherit;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
      #refresh-btn:disabled { opacity: 0.55; cursor: wait; }
      #refresh-btn svg { width: 1.1rem; height: 1.1rem; }
      #refresh-btn[aria-busy="true"] svg { animation: spin 0.75s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .filter-block { margin: 1rem 0 0.25rem; }
      .filter-label {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 0.35rem 0.15rem;
      }
      .chips {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.25rem;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar { display: none; }
      .chips button {
        flex: 0 0 auto;
        min-height: 2.75rem;
        padding: 0.45rem 0.95rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--chip);
        color: inherit;
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        touch-action: manipulation;
        white-space: nowrap;
      }
      .chips button[aria-pressed="true"] {
        background: var(--chip-active);
        color: var(--chip-active-text);
        border-color: var(--chip-active);
      }
      .feed { margin: 0.75rem 0 0; padding: 0; list-style: none; }
      .day-label {
        margin: 1.1rem 0 0.45rem;
        padding: 0 0.1rem;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .day-label:first-child { margin-top: 0.25rem; }
      li.card {
        list-style: none;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 0.75rem;
        margin-bottom: 0.65rem;
        display: grid;
        grid-template-columns: 6.75rem 1fr;
        gap: 0.75rem;
        align-items: start;
      }
      li.card.src-ksta { border-left: 4px solid #006994; }
      li.card:not(.has-thumb) { grid-template-columns: 1fr; }
      .thumb-wrap { display: block; }
      .thumb {
        width: 6.75rem;
        height: 4.5rem;
        border-radius: 0.45rem;
        object-fit: cover;
        background: var(--border);
        display: block;
      }
      .row-top {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex-wrap: wrap;
        margin-bottom: 0.3rem;
      }
      .row-top .source-logo {
        height: 1.25rem;
        width: auto;
        max-width: 5.5rem;
        object-fit: contain;
      }
      .source-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 1.25rem;
        padding: 0 0.45rem;
        border-radius: 4px;
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        line-height: 1;
        flex-shrink: 0;
      }
      .source-badge-ksta {
        background: #006994;
        color: #fff;
      }
      .title,
      .thumb-wrap {
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(0, 105, 148, 0.2);
      }
      .title {
        display: block;
        color: inherit;
        font-weight: 650;
        font-size: 1.02rem;
        line-height: 1.35;
        text-decoration: none;
      }
      .meta { color: var(--muted); font-size: 0.8rem; line-height: 1.3; }
      .sub-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.85rem;
        margin-top: 0.35rem;
        font-size: 0.78rem;
      }
      .sub-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
      .summary { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
      .badge-free {
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #15803d;
        background: #dcfce7;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        .badge-free { color: #86efac; background: #14532d; }
      }
      .badge-plus {
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #fff;
        background: #006994;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
      }
      .empty { padding: 2rem 1rem; text-align: center; color: var(--muted); }
      @media (max-width: 520px) {
        li.card.has-thumb {
          grid-template-columns: 1fr;
        }
        .thumb {
          width: 100%;
          height: auto;
          aspect-ratio: 16 / 9;
          max-height: 12rem;
        }
        #refresh-btn .refresh-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
        #refresh-btn { padding: 0.45rem; }
      }
    </style>
  </head>
  <body>
    <div id="ptr" aria-hidden="true"><div id="ptr-inner">Zum Aktualisieren loslassen</div></div>
    <div class="wrap">
      <header class="top">
        <div class="head-main">
          <h1>Schlagzeilen</h1>
          <span id="updated"></span>
        </div>
        <button type="button" id="refresh-btn" aria-label="Feed aktualisieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="refresh-label">Neu laden</span>
        </button>
      </header>
      <div class="filter-block">
        <p class="filter-label">Zeitraum</p>
        <div id="time-filters" class="chips" role="group" aria-label="Zeitraum"></div>
      </div>
      <div class="filter-block">
        <p class="filter-label">Anzeige</p>
        <div id="view-filters" class="chips" role="group" aria-label="Anzeige"></div>
      </div>
      <div id="feed" class="feed" role="feed" aria-busy="true"><p class="empty">Lade …</p></div>
    </div>

    <script>
      const feedEl = document.getElementById("feed");
      const timeFiltersEl = document.getElementById("time-filters");
      const viewFiltersEl = document.getElementById("view-filters");
      const refreshBtn = document.getElementById("refresh-btn");
      const updatedEl = document.getElementById("updated");
      const ptrEl = document.getElementById("ptr");
      const ptrInner = document.getElementById("ptr-inner");
      const timeFmt = new Intl.DateTimeFormat("de-DE", { dateStyle: "short", timeStyle: "short" });
      const dayFmt = new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long" });
      let sources = {};
      let articles = [];
      /** @type {"24h"|"48h"|"7d"|"all"} */
      let activeTime = "7d";
      /** @type {"all"|"paid"|"ksta-plus"} */
      let activeView = "all";

      const TIME_OPTIONS = [
        { id: "24h", label: "24 Stunden" },
        { id: "48h", label: "48 Stunden" },
        { id: "7d", label: "7 Tage" },
        { id: "all", label: "Alles" },
      ];
      const VIEW_OPTIONS = [
        { id: "all", label: "Alle" },
        { id: "paid", label: "Paywall" },
        { id: "ksta-plus", label: "KSTA+" },
      ];

      function assetUrl(path) {
        const basePath = location.pathname.replace(/\/index\.html$/, "").replace(/\/?$/, "/");
        return new URL(path, `${location.origin}${basePath}`).href;
      }

      function fmtDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        return Number.isNaN(d.getTime()) ? "" : timeFmt.format(d);
      }

      const ARCHIVE_HOST_RE = /^https:\/\/archive\.(is|ph|today|li|vn|fo|md)\//i;

      function articleOpenUrl(a) {
        if (a.free) return a.url;
        if (a.snapshotUrl && ARCHIVE_HOST_RE.test(a.snapshotUrl)) return a.snapshotUrl;
        return `https://archive.is/newest/${a.url}`;
      }

      function articleSource(a) {
        if (a.source && sources[a.source]) return a.source;
        try {
          return new URL(a.url).hostname.includes("ksta.de") ? "ksta" : "zeit";
        } catch {
          return "zeit";
        }
      }

      function cutoffMs() {
        const now = Date.now();
        if (activeView === "paid" || activeView === "ksta-plus") {
          return now - 14 * 24 * 60 * 60 * 1000;
        }
        if (activeTime === "24h") return now - 24 * 60 * 60 * 1000;
        if (activeTime === "48h") return now - 48 * 60 * 60 * 1000;
        if (activeTime === "7d") return now - 7 * 24 * 60 * 60 * 1000;
        return 0;
      }

      function isKstaPaid(a) {
        return articleSource(a) === "ksta" && a.access === "paid";
      }

      /** KSTA+ (RSS) or ZEIT without free wire/video path. */
      function isPaid(a) {
        if (isKstaPaid(a)) return true;
        return articleSource(a) === "zeit" && a.free === false;
      }

      function matchesView(a) {
        if (activeView === "all") return true;
        if (activeView === "paid") return isPaid(a);
        if (activeView === "ksta-plus") return isKstaPaid(a);
        return true;
      }

      function byTime() {
        const cut = cutoffMs();
        return articles
          .filter((a) => a.publishedAt && new Date(a.publishedAt).getTime() >= cut)
          .filter(matchesView)
          .sort((a, b) => (b.publishedAt ?? "").localeCompare(a.publishedAt ?? ""));
      }

      function dayHeading(iso) {
        if (!iso) return "Ohne Datum";
        const d = new Date(iso);
        const today = new Date();
        const y = new Date(today);
        y.setDate(today.getDate() - 1);
        if (d.toDateString() === today.toDateString()) return "Heute";
        if (d.toDateString() === y.toDateString()) return "Gestern";
        return dayFmt.format(d);
      }

      function renderTimeFilters() {
        timeFiltersEl.replaceChildren(
          ...TIME_OPTIONS.map(({ id, label }) => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = label;
            b.setAttribute("aria-pressed", String(id === activeTime));
            b.onclick = () => {
              activeTime = id;
              renderTimeFilters();
              renderFeed();
            };
            return b;
          }),
        );
      }

      function renderViewFilters() {
        viewFiltersEl.replaceChildren(
          ...VIEW_OPTIONS.map(({ id, label }) => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = label;
            b.setAttribute("aria-pressed", String(id === activeView));
            if (id === "ksta-plus" && id === activeView) b.style.borderColor = "#006994";
            else b.style.borderColor = "";
            b.onclick = () => {
              activeView = id;
              renderViewFilters();
              renderTimeFilters();
              renderFeed();
            };
            return b;
          }),
        );
      }

      function buildCard(a) {
        const srcId = articleSource(a);
        const li = document.createElement("li");
        li.className = "card" + (a.image ? " has-thumb" : "") + (srcId === "ksta" ? " src-ksta" : "");
        const body = document.createElement("div");
        const src = sources[articleSource(a)] ?? sources.zeit;
        if (!src) return li;

        if (a.image) {
          const wrap = document.createElement("a");
          wrap.className = "thumb-wrap";
          wrap.href = articleOpenUrl(a);
          wrap.target = "_blank";
          wrap.rel = "noopener noreferrer";
          const thumb = document.createElement("img");
          thumb.className = "thumb";
          thumb.src = a.image;
          thumb.alt = "";
          thumb.loading = "lazy";
          thumb.decoding = "async";
          thumb.referrerPolicy = "no-referrer";
          thumb.onerror = () => {
            li.classList.remove("has-thumb");
            wrap.remove();
          };
          wrap.append(thumb);
          li.append(wrap);
        }

        const top = document.createElement("div");
        top.className = "row-top";
        if (srcId === "ksta") {
          const badge = document.createElement("span");
          badge.className = "source-badge source-badge-ksta";
          badge.textContent = "KSTA";
          top.append(badge);
        } else {
          const logo = document.createElement("img");
          logo.src = assetUrl(src.logo);
          logo.alt = src.name;
          logo.className = "source-logo zeit-inv";
          logo.loading = "lazy";
          top.append(logo);
        }
        if (a.free) {
          const badge = document.createElement("span");
          badge.className = "badge-free";
          badge.textContent = "Frei";
          top.append(badge);
        } else if (isPaid(a)) {
          const plus = document.createElement("span");
          plus.className = "badge-plus";
          plus.style.background = srcId === "zeit" ? "#1a1a1a" : "#006994";
          plus.textContent = srcId === "zeit" ? "Z+" : "KSTA+";
          top.append(plus);
        }
        const time = document.createElement("span");
        time.className = "meta";
        if (a.publishedAt) time.textContent = fmtDate(a.publishedAt);
        top.append(time);

        const link = document.createElement("a");
        link.className = "title";
        link.href = articleOpenUrl(a);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = a.title;

        const meta = document.createElement("div");
        meta.className = "meta";
        const via = a.archiveVia ?? "";
        const srcLabel = srcId === "ksta" ? "KSTA" : src.shortName;
        meta.textContent = [srcLabel, a.section, via].filter(Boolean).join(" · ");

        const sub = document.createElement("div");
        sub.className = "sub-links";
        const extras = a.free
          ? [["Archiv", a.archiveUrl]]
          : [["Original", a.url], ["Neu archivieren", a.saveUrl]];
        for (const [label, href] of extras) {
          const x = document.createElement("a");
          x.href = href;
          x.target = "_blank";
          x.rel = "noopener noreferrer";
          x.textContent = label;
          sub.append(x);
        }

        body.append(top, link, meta, sub);
        if (a.summary) {
          const p = document.createElement("p");
          p.className = "summary";
          p.textContent = a.summary;
          body.append(p);
        }
        li.append(body);
        return li;
      }

      let renderGen = 0;

      function renderFeed() {
        const gen = ++renderGen;
        const shown = byTime();
        feedEl.replaceChildren();
        if (!shown.length) {
          feedEl.innerHTML = '<p class="empty">Keine Artikel in diesem Zeitraum.</p>';
          return;
        }
        let lastDay = "";
        let i = 0;
        const batch = 35;

        const step = () => {
          if (gen !== renderGen) return;
          const end = Math.min(i + batch, shown.length);
          for (; i < end; i++) {
            const a = shown[i];
            const day = dayHeading(a.publishedAt);
            if (day !== lastDay) {
              lastDay = day;
              const h = document.createElement("h2");
              h.className = "day-label";
              h.textContent = day;
              feedEl.append(h);
            }
            feedEl.append(buildCard(a));
          }
          if (i < shown.length) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      async function loadArticles({ force = false } = {}) {
        refreshBtn.disabled = true;
        refreshBtn.setAttribute("aria-busy", "true");
        feedEl.setAttribute("aria-busy", "true");
        try {
          if (force) {
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
          }
          const url = assetUrl(`articles.json${force ? `?t=${Date.now()}` : ""}`);
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error(String(res.status));
          const data = await res.json();
          sources = Object.fromEntries(
            Object.entries(data.sources ?? {}).map(([id, s]) => [id, { ...s, logo: assetUrl(s.logo) }]),
          );
          articles = data.articles ?? [];
          updatedEl.textContent = "Aktualisiert: " + fmtDate(data.updatedAt);
          renderFeed();
        } catch (err) {
          console.error(err);
          feedEl.innerHTML =
            '<p class="empty">Artikel konnten nicht geladen werden. Bitte neu laden.</p>';
        } finally {
          feedEl.setAttribute("aria-busy", "false");
          refreshBtn.disabled = false;
          refreshBtn.removeAttribute("aria-busy");
        }
      }

      refreshBtn.addEventListener("click", () => loadArticles({ force: true }));

      let ptrStartY = 0;
      let ptrPull = 0;
      let ptrActive = false;
      const PTR_TRIGGER = 72;

      document.addEventListener(
        "touchstart",
        (e) => {
          if (window.scrollY > 4 || refreshBtn.disabled) return;
          if (e.target.closest("a, button")) return;
          ptrStartY = e.touches[0].clientY;
          ptrActive = true;
        },
        { passive: true },
      );
      document.addEventListener(
        "touchmove",
        (e) => {
          if (!ptrActive) return;
          ptrPull = Math.max(0, e.touches[0].clientY - ptrStartY);
          if (ptrPull > 8) {
            ptrEl.classList.add("visible");
            ptrInner.textContent =
              ptrPull >= PTR_TRIGGER ? "Loslassen zum Aktualisieren" : "Nach unten ziehen …";
          }
        },
        { passive: true },
      );
      document.addEventListener("touchend", () => {
        if (ptrActive && ptrPull >= PTR_TRIGGER) loadArticles({ force: true });
        ptrActive = false;
        ptrPull = 0;
        ptrEl.classList.remove("visible");
      });

      renderTimeFilters();
      renderViewFilters();
      loadArticles();

      if ("serviceWorker" in navigator) {
        const basePath = location.pathname.replace(/\/index\.html$/, "").replace(/\/?$/, "/");
        const registerSw = () => {
          navigator.serviceWorker
            .register(`${basePath}sw.js`, { scope: basePath, updateViaCache: "none" })
            .then((reg) => reg.update())
            .catch(() => {});
        };
        if (document.readyState === "complete") registerSw();
        else window.addEventListener("load", registerSw, { once: true });
      }
    </script>
  </body>
</html>
